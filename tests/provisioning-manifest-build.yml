# The module under test is built by the pipeline and installed from tests/artifacts by env.run.sh.
# The Jahia image already holds what the suite needs: jContent, siteSettings and templates-system.
- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/internal/@id=jahia-internal@snapshots'
  username: ${env:NEXUS_USERNAME}
  password: ${env:NEXUS_PASSWORD}
